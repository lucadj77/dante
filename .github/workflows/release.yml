name: Release

# Publishes a version of Dante, without a terminal (Actions > Release > Run workflow, choosing
# the branch). See docs/rilascio.md.
#
# - From main, "beta" publishes the next beta of the coming minor version (1.1.0-beta.1, then
#   -beta.2...) and "stable" the minor version itself (1.1.0). After a stable one the branch
#   release/1.1 is made from its tag, for the corrections, and main moves on to 1.2.0.
# - From release/x.y the choice does not matter: it publishes the next correction (1.1.1).
#
# The version is worked out from package.json and the tags. The workflow stops when its tag
# already exists or when docs/novita.md and docs/whats-new.md say nothing for it. Otherwise it
# writes the notes under the version's heading (news.py release) and the version in
# package.json, commits both, tags the commit v<version> and starts Builds on that tag: Builds
# makes the files, publishes the release and then updates the site (web.yml). A tag pushed
# with the workflow's own token starts no other workflow, hence the explicit start.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "From main: beta or stable. From release/x.y: always a correction."
        type: choice
        options: [beta, stable]
        default: beta

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KIND: ${{ inputs.kind }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Only from main or release/x.y
        run: |
          case "$BRANCH" in
            main|release/*) ;;
            *) echo "::error::Release runs from main or release/x.y, not from $BRANCH"; exit 1;;
          esac
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        run: |
          echo "Commit: $(git log -1 --format='%h %s')"
          base=$(node -p "require('./package.json').version.replace(/-.*/, '')")
          IFS=. read -r major minor patch <<< "$base"
          if [ "$BRANCH" = main ]; then
            if git rev-parse -q --verify "refs/tags/v$base" > /dev/null; then
              echo "::error::v$base is already out: main should carry the next minor version in package.json"; exit 1
            fi
            if [ "$KIND" = stable ]; then
              version=$base
            else
              last=$(git tag -l "v$base-beta.*" | sed "s/^v$base-beta\.//" | sort -n | tail -1)
              version="$base-beta.$(( ${last:-0} + 1 ))"
            fi
          else
            expected="release/$major.$minor"
            if [ "$BRANCH" != "$expected" ]; then
              echo "::error::package.json says $base, which belongs on $expected"; exit 1
            fi
            while git rev-parse -q --verify "refs/tags/v$major.$minor.$patch" > /dev/null; do patch=$((patch + 1)); done
            version="$major.$minor.$patch"
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version already exists"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"
          echo "### Dante $version" >> "$GITHUB_STEP_SUMMARY"
          echo "From $BRANCH at $(git log -1 --format='%h %s')" >> "$GITHUB_STEP_SUMMARY"
      - name: Notes and version, committed and tagged
        run: |
          python3 .github/news.py release docs "$version"
          npm version "$version" --no-git-tag-version --allow-same-version > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Dante $version [skip ci]"
          git tag "v$version"
          git push -q origin "HEAD:$BRANCH" "v$version"
      - name: Branch for the corrections, and main on to the next minor version
        if: ${{ github.ref_name == 'main' && inputs.kind == 'stable' }}
        run: |
          IFS=. read -r major minor patch <<< "$version"
          git push -q origin "v$version:refs/heads/release/$major.$minor"
          npm version "$major.$((minor + 1)).0" --no-git-tag-version > /dev/null
          git commit -qam "Main verso Dante $major.$((minor + 1)).0 [skip ci]"
          git push -q origin HEAD:main
      - name: Build and publish
        run: |
          gh workflow run builds.yml --ref "v$version"
          echo "Builds started on v$version: https://github.com/$GH_REPO/actions/workflows/builds.yml" >> "$GITHUB_STEP_SUMMARY"
