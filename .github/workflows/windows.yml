name: Windows

# Builds the Windows installer. Every run keeps it as an artifact of the run; runs on
# main and on manual request also put it on the "windows-preview" release, where it
# can be downloaded without unzipping.

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The Rust crate embeds the built frontend, so it has to exist first.
      - run: npm run build
      - run: cargo test
        working-directory: src-tauri

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - name: Name the installer after the commit
        id: name
        shell: bash
        run: |
          src=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -n 1)
          dest="Dante-setup-${GITHUB_SHA::7}.exe"
          cp "$src" "$dest"
          echo "file=$dest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Dante-windows
          path: ${{ steps.name.outputs.file }}
      - name: Publish on the windows-preview release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-preview --yes --cleanup-tag || true
          gh release create windows-preview "${{ steps.name.outputs.file }}" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Dante per Windows (anteprima)" \
            --notes "Installatore di prova compilato da ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Non è firmato: Windows mostra un avviso di SmartScreen."
