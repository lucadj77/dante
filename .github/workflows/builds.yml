name: Builds

# Builds Dante for Windows (installer and portable zip), Linux (AppImage, .deb, .rpm)
# and macOS (.dmg for Apple Silicon and for Intel), with the version in package.json.
# Every run keeps the files as artifacts of the run. A run on a tag v<version>, which the
# Release workflow starts, also publishes the release of that tag: a prerelease for a beta
# (1.1.0-beta.1), the latest release for a stable version (1.1.0), with the notes of the
# version from docs/novita.md and docs/whats-new.md. See docs/rilascio.md.

# With the TAURI_SIGNING_PRIVATE_KEY secret set, the builds also make the signed files the
# automatic update downloads, and the release gets a latest.json listing them, which the
# installed copies read (src-tauri/src/updates.rs). Without the secret they are skipped.

# Started by hand (Actions > Builds > Run workflow) to try a branch, or by Release on a tag.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The Rust crate embeds the built frontend, so it has to exist first.
      - run: npm run build
      - run: bash .github/check-build.sh
      - run: cargo test
        working-directory: src-tauri

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash .github/ci-config.sh
      - name: Version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - run: npx tauri build --bundles nsis --config src-tauri/ci.conf.json
      - name: Installer and portable zip, named after the version
        shell: bash
        run: |
          mkdir -p out portable/Dante/dante-data
          cp src-tauri/target/release/bundle/nsis/*.exe "out/Dante-setup-$version.exe"
          # The signature of the installer, for the automatic update.
          for sig in src-tauri/target/release/bundle/nsis/*.exe.sig; do
            if [ -f "$sig" ]; then cp "$sig" "out/Dante-setup-$version.exe.sig"; fi
          done
          # The portable copy is the program itself plus a dante-data folder: its
          # presence makes Dante keep settings there instead of in the user profile.
          cp src-tauri/target/release/dante.exe portable/Dante/Dante.exe
          cp .github/portable-readme.txt portable/Dante/dante-data/LEGGIMI.txt
          (cd portable && 7z a -tzip "../out/Dante-portable-$version.zip" Dante > /dev/null)
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: Dante-windows
          path: out/*

  linux:
    # The oldest supported Ubuntu, so the packages also run on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash .github/ci-config.sh
      - name: Version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - run: npx tauri build --bundles appimage,deb,rpm --config src-tauri/ci.conf.json
      - name: Packages, named after the version
        run: |
          mkdir -p out
          b=src-tauri/target/release/bundle
          cp $b/appimage/*.AppImage "out/Dante-$version-x86_64.AppImage"
          cp $b/deb/*.deb "out/Dante-$version-amd64.deb"
          cp $b/rpm/*.rpm "out/Dante-$version-x86_64.rpm"
          # Signatures for the automatic update, where the bundler made them.
          for f in appimage/*.AppImage.sig:x86_64.AppImage.sig deb/*.deb.sig:amd64.deb.sig rpm/*.rpm.sig:x86_64.rpm.sig; do
            for sig in $b/${f%%:*}; do
              if [ -f "$sig" ]; then cp "$sig" "out/Dante-$version-${f#*:}"; fi
            done
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: Dante-linux
          path: out/*

  macos:
    # One image per processor family: each is about half the size of a universal one.
    # The Intel build is cross-compiled on the Apple Silicon runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: apple-silicon
          - target: x86_64-apple-darwin
            name: intel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash .github/ci-config.sh
      - name: Version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      # Ad-hoc signed only (signingIdentity "-"): no Apple Developer account yet.
      - run: npx tauri build --target ${{ matrix.target }} --bundles app --config src-tauri/ci.conf.json
      - name: Disk image, named after the version
        run: |
          mkdir -p out dmg
          cp -R src-tauri/target/${{ matrix.target }}/release/bundle/macos/Dante.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil underestimates the size of an APFS image ("No space left on device"),
          # so the volume is HFS+ with an explicit size: the app plus some margin.
          size=$(( $(du -sm dmg | cut -f1) + 20 ))
          hdiutil create -volname Dante -srcfolder dmg -fs HFS+ -size ${size}m -ov -format UDZO "out/Dante-$version-mac-${{ matrix.name }}.dmg"
          # The automatic update replaces the app with this archive.
          b=src-tauri/target/${{ matrix.target }}/release/bundle/macos
          if [ -f $b/Dante.app.tar.gz.sig ]; then
            cp $b/Dante.app.tar.gz "out/Dante-$version-mac-${{ matrix.name }}.app.tar.gz"
            cp $b/Dante.app.tar.gz.sig "out/Dante-$version-mac-${{ matrix.name }}.app.tar.gz.sig"
          fi
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: Dante-macos-${{ matrix.name }}
          path: out/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-windows, windows, linux, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Version and notes
        run: |
          version=${GITHUB_REF_NAME#v}
          written=$(node -p "require('./src/package.json').version")
          if [ "$version" != "$written" ]; then
            echo "::error::The tag says $version, package.json $written"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"
          python3 src/.github/news.py history src/docs "$version" > news.json
          python3 src/.github/news.py body src/docs "$version" > notes.md
          cat notes.md
      - name: Update manifest
        run: python3 src/.github/latest-json.py out "$version" "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME" news.json
      - name: Publish the release
        run: |
          case "$version" in
            *-*) kind=--prerelease; title="Dante $version (beta)";;
            *) kind=--latest; title="Dante $version";;
          esac
          cat >> notes.md <<EOF

          ---

          Tutte le novità: https://github.com/${{ github.repository }}/blob/main/docs/novita.md (in English: https://github.com/${{ github.repository }}/blob/main/docs/whats-new.md)

          Windows: Dante-setup è l'installatore; Dante-portable è la versione portatile (estrai lo zip e avvia Dante.exe). Non sono firmati: Windows mostra un avviso di SmartScreen.
          Mac: scegli il .dmg giusto (apple-silicon per i Mac dal 2020 con chip M1 o successivi, intel per quelli precedenti), aprilo e trascina Dante in Applicazioni. Non è firmato da Apple: la prima volta macOS lo blocca, poi Impostazioni di Sistema > Privacy e sicurezza > Apri comunque.
          Linux: l'AppImage funziona su quasi tutte le distribuzioni (rendilo eseguibile e avvialo); il .deb è per Ubuntu e Debian, il .rpm per Fedora e openSUSE.

          I file .sig, .app.tar.gz e latest.json servono all'aggiornamento automatico: non vanno scaricati.
          EOF
          gh release create "$GITHUB_REF_NAME" out/* --verify-tag $kind --title "$title" --notes-file notes.md
      # Copies of Dante 0.1.x look for updates only in the old "preview" release: its
      # latest.json, pointing to this release's files, brings them to the latest stable version.
      - name: Bring the 0.1.x copies along
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          if [ -f out/latest.json ] && gh release view preview > /dev/null 2>&1; then
            gh release upload preview out/latest.json --clobber
            gh release edit preview --title "Aggiornamenti per Dante 0.1.x" --notes "Questa pagina serve solo alle copie di Dante 0.1.x, che cercano qui gli aggiornamenti: il suo latest.json le porta all'ultima versione stabile. Per scaricare Dante: https://github.com/${{ github.repository }}/releases/latest"
          fi

  # The site and the web version on GitHub Pages, with this release in app/ or beta/ (web.yml).
  web:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/web.yml
